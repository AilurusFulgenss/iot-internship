; PlatformIO Configuration — LIV-24 IoT Node
; Board: Waveshare ESP32-P4-86-Panel-ETH-2RO
; Platform: pioarduino (community fork รองรับ ESP32-P4 / IDF 5.3)

[env:esp32p4]
; ดึง platform จาก pioarduino ที่รองรับ P4 แล้ว
platform = https://github.com/pioarduino/platform-espressif32.git#develop
framework = espidf
board = esp32-p4

; Serial Monitor
monitor_speed = 115200

; Custom partition table (SPIFFS for logo storage)
board_build.partitions = partitions.csv

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM
    -DMQTT_BROKER_URI=\"mqtt://192.168.1.111:1883\"
    -DMQTT_USERNAME=\"mqtt\"
    -DMQTT_PASSWORD=\"mqtt1234\"
    ; Static IP (router does not assign DHCP to ESP32 MAC)
    -DSTATIC_IP_ADDR=\"192.168.1.200\"
    -DSTATIC_GW_ADDR=\"192.168.1.1\"
    -DSTATIC_MASK_ADDR=\"255.255.255.0\"
    -DLOGO_SERVER_URL=\"http://192.168.1.107:8080/logo.bin\"
