# Loads default set of integrations. Do not remove.
default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

mqtt:
  sensor:
    # ── SN-300 PM Sensor ─────────────────────────────────────────────
    # Topic format: esp32_p4_86/{device_id}/sensors
    # + wildcard accepts data from any device (fine for single-device setup)
    - name: "LIV24 Temperature"
      unique_id: liv24_temp
      state_topic: "esp32_p4_86/+/sensors"
      value_template: "{{ value_json.temperature | default(none) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement

    - name: "LIV24 Humidity"
      unique_id: liv24_hum
      state_topic: "esp32_p4_86/+/sensors"
      value_template: "{{ value_json.humidity | default(none) }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement

    - name: "LIV24 PM2.5"
      unique_id: liv24_pm25
      state_topic: "esp32_p4_86/+/sensors"
      value_template: "{{ value_json.pm2_5 | default(none) }}"
      unit_of_measurement: "µg/m³"
      device_class: pm25
      state_class: measurement

    - name: "LIV24 PM10"
      unique_id: liv24_pm10
      state_topic: "esp32_p4_86/+/sensors"
      value_template: "{{ value_json.pm10 | default(none) }}"
      unit_of_measurement: "µg/m³"
      device_class: pm10
      state_class: measurement

    - name: "LIV24 Sound"
      unique_id: liv24_sound
      state_topic: "esp32_p4_86/+/sensors"
      value_template: "{{ value_json.sound | default(none) }}"
      unit_of_measurement: "dB"
      state_class: measurement

    # Confirmed relay mode reported back by ESP32 after applying relay/mode command
    - name: "LIV24 Relay Mode"
      unique_id: liv24_relay_mode
      state_topic: "esp32_p4_86/+/relay/mode/state"
      icon: mdi:remote

  switch:
    # Device ID: 30eda0ea5d0f (visible on DEV screen → Network tab)
    - name: "LIV24 Relay 1"
      unique_id: liv24_relay_1
      command_topic: "esp32_p4_86/30eda0ea5d0f/relay/1/set"
      state_topic: "esp32_p4_86/+/relay/1/state"
      payload_on: "ON"
      payload_off: "OFF"
      retain: false

    - name: "LIV24 Relay 2"
      unique_id: liv24_relay_2
      command_topic: "esp32_p4_86/30eda0ea5d0f/relay/2/set"
      state_topic: "esp32_p4_86/+/relay/2/state"
      payload_on: "ON"
      payload_off: "OFF"
      retain: false

sensor:
  # 1-hour rolling averages — used by history graphs in dashboard
  - platform: statistics
    name: "LIV24 Temp 1h"
    entity_id: sensor.liv24_temperature
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 20

  - platform: statistics
    name: "LIV24 Hum 1h"
    entity_id: sensor.liv24_humidity
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 20

  - platform: statistics
    name: "LIV24 PM25 1h"
    entity_id: sensor.liv24_pm2_5
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 20

  - platform: statistics
    name: "LIV24 PM10 1h"
    entity_id: sensor.liv24_pm10
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 20

  - platform: statistics
    name: "LIV24 Sound 1h"
    entity_id: sensor.liv24_sound
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 20

# ── LIV24 Relay Rule helpers ──────────────────────────────────────
input_boolean:
  liv24_relay_remote:
    name: "Relay Remote Mode"
    initial: false
    icon: mdi:remote
  liv24_rule1_enabled:
    name: "Rule 1 Enabled"
    initial: false
    icon: mdi:play-circle-outline
  liv24_rule2_enabled:
    name: "Rule 2 Enabled"
    initial: false
    icon: mdi:play-circle-outline

input_select:
  liv24_rule1_var:
    name: "Rule 1 — Variable"
    options: [temperature, humidity, pm2_5, pm10, sound]
    initial: temperature
    icon: mdi:thermometer
  liv24_rule1_condition:
    name: "Rule 1 — Condition"
    options: [">=", "<=", "==", ">", "<"]
    initial: ">="
    icon: mdi:code-greater-than-or-equal
  liv24_rule1_output:
    name: "Rule 1 — Output"
    options: ["Relay 1", "Relay 2"]
    initial: "Relay 1"
    icon: mdi:toggle-switch-outline

  liv24_rule2_var:
    name: "Rule 2 — Variable"
    options: [temperature, humidity, pm2_5, pm10, sound]
    initial: humidity
    icon: mdi:water-percent
  liv24_rule2_condition:
    name: "Rule 2 — Condition"
    options: [">=", "<=", "==", ">", "<"]
    initial: ">="
    icon: mdi:code-greater-than-or-equal
  liv24_rule2_output:
    name: "Rule 2 — Output"
    options: ["Relay 1", "Relay 2"]
    initial: "Relay 2"
    icon: mdi:toggle-switch-outline

input_number:
  liv24_rule1_threshold:
    name: "Rule 1 — Threshold"
    min: -50
    max: 1000
    step: 0.5
    initial: 25
    icon: mdi:target
  liv24_rule2_threshold:
    name: "Rule 2 — Threshold"
    min: -50
    max: 1000
    step: 0.5
    initial: 70
    icon: mdi:target
