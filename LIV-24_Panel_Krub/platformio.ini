; PlatformIO Configuration — LIV-24 Panel (Standalone)
; Board: Waveshare ESP32-P4-86-Panel-ETH-2RO
; Standalone: RS485 sensor display only — no network, no MQTT, no SPIFFS

[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32.git#develop
framework = espidf
board = esp32-p4

monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
